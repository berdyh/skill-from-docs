name: scripts-smoke
on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'references/**'
      # docs-guard also scans these two, so a change to either must run it.
      - 'SKILL.md'
      - 'README.md'
      - '.github/workflows/scripts-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'references/**'
      # docs-guard also scans these two, so a change to either must run it.
      - 'SKILL.md'
      - 'README.md'
      - '.github/workflows/scripts-smoke.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python = ">=3.10" with no upper bound,
        # so the matrix has to exercise the upper end too.
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: '${{ matrix.python }}' }
      - run: pip install -e ./scripts
      - run: pip install pytest pytest-cov
      - run: pytest scripts/test/ -v --cov=skill_from_docs --cov-report=term-missing

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # Pinned: an unpinned ruff means a new release can fail CI with no
      # change in this repo.
      - run: pip install ruff==0.15.13
      - run: ruff check scripts/src scripts/test

  # scripts/README.md calls `validate --json` a stable v1 contract that CI
  # consumers may assert on. This job IS such a consumer: it runs the documented
  # commands through the installed CLI and asserts the contract from outside the
  # package, which is what the pytest suite cannot do. The `warn` verdict was
  # documented for a release while no input could produce it; the point of
  # running the real binary is that a claim about behaviour stays unverified
  # until something executes it.
  cli-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -e ./scripts
      - name: Seed the workspace the README documents
        run: |
          mkdir -p ws/raw ws/probes
          cp scripts/test/fixtures/hcloud-offline/spec.json \
             scripts/test/fixtures/hcloud-offline/source-map.json ws/raw/
          cp scripts/test/fixtures/hcloud-offline/*-200.json ws/probes/
      - name: consolidate + validate --json, then assert the contract
        run: |
          openapi-harvest consolidate ws --merge-probes
          openapi-harvest validate ws --json > verdict.json
          python - <<'PY'
          import json, sys
          from skill_from_docs.cmd_validate import VERDICTS
          payload = json.load(open("verdict.json"))
          missing = {"workspace", "verdict", "checks", "warnings", "summary", "checked_at"} - set(payload)
          assert not missing, f"validate --json dropped documented keys: {sorted(missing)}"
          assert payload["verdict"] in VERDICTS, payload["verdict"]
          assert payload["verdict"] == "pass", payload["summary"]
          PY
      - name: re-running consolidate must not invalidate the workspace
        run: |
          openapi-harvest consolidate ws --merge-probes
          openapi-harvest validate ws --strict

  # A handful of forbidden literals, not a doc-lint framework. DEFERRED.md §D3
  # measured a real linter against the ~20 drifts this repo has actually shipped
  # and it would have caught approximately none of them — every one was semantic.
  # What a linter *can* catch is the small set of literals that were wrong, got
  # fixed, and would rot again the same way. Each rule below names one of those
  # and says why, because a contributor who trips it needs to know the reason,
  # not just that the string is banned. The executable half of this guarantee
  # lives in `scripts/test/test_documented_offline_smoke.py` and the
  # `cli-contract` job above; those run the documented commands for real.
  docs-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: No hardcoded endpoint count in the case study
        run: |
          if grep -nE "# → [0-9]+" references/case-study-hetzner-openapi.md; then
            echo "::error::references/case-study-hetzner-openapi.md hardcodes an endpoint count. It tracks an upstream community mirror that changes without notice, so any number written here is wrong on some future day and nothing will notice. Say that the command prints the current endpoint count instead."
            exit 1
          fi

      # scripts/README.md is deliberately NOT scanned here. Its one `Pass: N/N`
      # lives in the `validate --json` schema block, and
      # test_cmd_validate.py::test_summary_string_is_the_shape_the_readme_documents
      # parses it back out and asserts the format and the arithmetic against a
      # live run. An executable check beats a grep, so that file is governed by
      # the test instead of by this rule.
      - name: No hardcoded validate check count
        run: |
          if grep -rnE "Pass: [0-9]+/[0-9]+" references/ SKILL.md README.md; then
            echo "::error::A doc hardcodes a 'Pass: N/N' summary from openapi-harvest validate. The check total is dynamic — validate emits one check per docs.md section, so it moves with the spec's tag and endpoint count and with how much narrative was merged. 'Pass: 10/10' was documented while the real number was 16, and it will drift again. Write 'Pass: <n>/<n>' or describe the output instead."
            exit 1
          fi

      - name: No invented probe-fixture filenames
        run: |
          if grep -rn "auth-discovery.json" references/ scripts/README.md SKILL.md README.md; then
            echo "::error::A doc names a fixture file 'auth-discovery.json'. No such file is ever written: 'auth-discovery' is a --scope label, and openapi-harvest auth writes probes/auth-<host>-<baseline-status>.json. Cite the real name, or refer to the scope without a filename."
            exit 1
          fi
          if grep -rn "locations-200.json" references/ scripts/README.md SKILL.md README.md; then
            echo "::error::A doc names a probe fixture 'locations-200.json'. openapi-harvest probe derives the filename from the method and URL path and never includes a status code — it writes probes/get-v1-locations.json. (The bundled offline fixtures under scripts/test/fixtures/ do use -200 names; copy them with a glob rather than naming one, so this rule stays scoped to claims about probe output.)"
            exit 1
          fi
